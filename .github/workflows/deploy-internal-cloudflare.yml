name: Deploy VetWel Internal Worker

on:
  workflow_dispatch:
  push:
    branches:
      - vetwel-rebuild
    paths:
      - "internal-app/**"
      - ".github/workflows/deploy-internal-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: vetwel-internal-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy vetwel-internal-ai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal-app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "72994666ab50ebd44473f30ce7c9c054"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

    steps:
      - name: Check out vetwel-rebuild
        uses: actions/checkout@v4
        with:
          ref: vetwel-rebuild

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is missing"
            exit 1
          fi
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::CLERK_SECRET_KEY is missing"
            exit 1
          fi

      - name: Verify Cloudflare compatibility
        run: npm run check:cloudflare

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Deploy with Clerk secrets
        shell: bash
        run: |
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg publishable "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --arg secret "$CLERK_SECRET_KEY" \
            '{NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: $publishable, CLERK_SECRET_KEY: $secret}' \
            > "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file"
