name: Notify IndexNow

on:
  push:
    branches:
      - vetwel-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build changed URL list
        id: urls
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          base = "https://vetwel.us/"
          event = os.getenv("EVENT_NAME", "")
          before = os.getenv("BEFORE", "")
          after = os.getenv("AFTER", "HEAD")

          if event == "workflow_dispatch" or not before or set(before) == {"0"}:
              changed = [".indexnow-bootstrap"]
          else:
              try:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, after], text=True
                  ).splitlines()
              except Exception:
                  changed = [".indexnow-bootstrap"]

          urls = []
          if ".indexnow-bootstrap" in changed:
              root = ET.parse("sitemap.xml").getroot()
              ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              urls = [
                  node.text.strip()
                  for node in root.findall("s:url/s:loc", ns)
                  if node.text
              ]
          else:
              for path in changed:
                  if path == "index.html":
                      urls.append(base)
                  elif path.endswith(".html"):
                      urls.append(base + path)

          clean = []
          for url in urls:
              if url.startswith(base) and url not in clean:
                  clean.append(url)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"count={len(clean)}\n")
              output.write("json=" + json.dumps(clean, separators=(",", ":")) + "\n")

          print("Changed files:", changed)
          print("URLs to submit:")
          for url in clean:
              print(url)
          PY

      - name: Submit URLs to IndexNow
        if: steps.urls.outputs.count != '0'
        env:
          URLS: ${{ steps.urls.outputs.json }}
          INDEXNOW_KEY: 1d01f54a276df52487ca8492a6c70e76
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ["INDEXNOW_KEY"]
          urls = json.loads(os.environ["URLS"])
          payload = {
              "host": "vetwel.us",
              "key": key,
              "keyLocation": f"https://vetwel.us/{key}.txt",
              "urlList": urls,
          }

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("IndexNow status:", response.status)
                  if response.status not in (200, 202):
                      raise SystemExit(1)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print("IndexNow error:", error.code, body)
              if error.code not in (200, 202):
                  raise
          PY
